<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Files & APK | Monir Hossen</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b, #0f172a 50%, #020617);
      color: #f8fafc;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 15px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 25px;
      padding: 10px 18px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: translateX(-3px);
    }

    .hub-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .hub-header h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .hub-header p {
      font-size: 15px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .downloads-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 600px) {
      .downloads-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
    }

    .file-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .file-card:hover {
      transform: translateY(-5px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 20px 45px rgba(56, 189, 248, 0.15);
    }

    .app-logo {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    .logo-green { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; }
    .logo-red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff; }
    .logo-yellow { background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff; }
    .logo-blue { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #ffffff; }

    .file-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .file-meta {
      font-size: 12.5px;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .download-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      filter: brightness(1.1);
    }

    .loading-text {
      text-align: center;
      font-size: 16px;
      color: #38bdf8;
      grid-column: 1 / -1;
      padding: 30px;
    }

    footer {
      text-align: center;
      padding: 40px 0 10px 0;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> BACK TO HOME
    </a>

    <div class="hub-header">
      <h1>FILES & APK REPOSITORY</h1>
      <p>Download tools, client resources, APK apps, and marketing materials.</p>
    </div>

    <!-- আপলোড করা ফাইলগুলো স্বয়ংক্রিয়ভাবে এখানে আসবে -->
    <div class="downloads-grid" id="fileList">
      <div class="loading-text">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading uploaded files and APKs...
      </div>
    </div>

    <footer>
      <p>© 2026 Monir Hossen. All Rights Reserved. | Files & APK Hub</p>
    </footer>

  </div>

  <script>
    const username = "info-monirhossen";
    const repo = "info-monirhossen.github.io";
    const folderPath = "files";

    const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folderPath}`;

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return 'Direct Download';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFileInfo(fileName) {
      const ext = fileName.split('.').pop().toLowerCase();
      
      switch (ext) {
        case 'apk':
          return { icon: 'fa-brands fa-android', color: 'logo-green', type: 'Android APK' };
        case 'pdf':
          return { icon: 'fa-solid fa-file-pdf', color: 'logo-red', type: 'PDF Document' };
        case 'zip':
        case 'rar':
        case '7z':
          return { icon: 'fa-solid fa-file-zipper', color: 'logo-yellow', type: 'ZIP Archive' };
        case 'exe':
        case 'msi':
          return { icon: 'fa-brands fa-windows', color: 'logo-blue', type: 'Windows App' };
        default:
          return { icon: 'fa-solid fa-file-arrow-down', color: 'logo-blue', type: 'File' };
      }
    }

    async function loadFiles() {
      const fileContainer = document.getElementById("fileList");
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("No files");
        
        const files = await response.json();
        fileContainer.innerHTML = "";

        let validFiles = files.filter(file => file.type === "file" && file.name !== ".gitkeep");

        if (validFiles.length === 0) {
          fileContainer.innerHTML = `<div class="loading-text">No files available yet. Upload files inside the "files" folder to see them here!</div>`;
          return;
        }

        validFiles.forEach(file => {
          const info = getFileInfo(file.name);
          const sizeText = formatBytes(file.size);

          const card = document.createElement("div");
          card.className = "file-card";
          card.innerHTML = `
            <div class="app-logo ${info.color}">
              <i class="${info.icon}"></i>
            </div>
            <h3 class="file-name">${file.name}</h3>
            <p class="file-meta">${info.type} • ${sizeText}</p>
            <a href="${file.download_url}" download class="download-btn">
              <span>DOWNLOAD</span>
              <i class="fa-solid fa-download"></i>
            </a>
          `;
          fileContainer.appendChild(card);
        });

      } catch (err) {
        fileContainer.innerHTML = `<div class="loading-text">Upload files in the <b>files</b> folder of your GitHub repository!</div>`;
      }
    }

    loadFiles();
  </script>
</body>
</html>
